name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write # create the release tag
  packages: write # publish to GitHub Packages

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      - name: Check if version changed
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          # A tag already existing means this version is already released.
          if git rev-parse "v$CURRENT" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine npm tag
        if: steps.version.outputs.changed == 'true'
        id: npm-tag
        run: |
          VERSION="${{ steps.version.outputs.current }}"
          if echo "$VERSION" | grep -qE '-(alpha|beta|rc)'; then
            PRE=$(echo "$VERSION" | sed 's/.*-\([a-z]*\).*/\1/')
            echo "tag=$PRE" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # GitHub Packages only. The public npmjs release is published by hand
      # (see docs/guides/publishing.md in the control plane) because there is
      # no working npm automation token — npmjs 2FA is enforced on the
      # @verevoir org for publish.
      #
      # GITHUB_TOKEN is provided automatically by Actions, so this step needs
      # no configured secret and works in every repo in the org.
      # Re-point npm's auth config at GitHub Packages. setup-node writes its
      # .npmrc into RUNNER_TEMP and exports NPM_CONFIG_USERCONFIG at it, which
      # overrides ~/.npmrc entirely — so appending an auth line to ~/.npmrc is
      # silently ignored and the publish fails ENEEDAUTH. Re-running setup-node
      # is the supported way to switch registries mid-job.
      - uses: actions/setup-node@v4
        if: steps.version.outputs.changed == 'true'
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@verevoir'

      - name: Publish to GitHub Packages
        if: steps.version.outputs.changed == 'true'
        run: npm publish --tag ${{ steps.npm-tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tag LAST, and only once the publish above succeeded. Tagging first
      # would leave a tag behind on a failed publish, and the version-changed
      # check above treats an existing tag as "already released" — so the
      # package would be skipped on every subsequent run.
      - name: Create git tag
        if: steps.version.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.current }}"
          git push origin "v${{ steps.version.outputs.current }}"
